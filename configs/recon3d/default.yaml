output_dir: runs/recon3d_live
extrinsics_path: configs/recon3d/extrinsics.json
sync_max_drift_ms: 50.0

# Hardware camera settings used by:
#   python -m recon3d.cli run --config configs/recon3d/default.yaml
#
# For a formal three-camera run, keep serial_number bound to the physical cameras.
# Start secondaries before the primary; MultiFemtoBoltRig does this automatically
# when sync_mode is set below. If hardware sync cable is not connected yet, use
# sync_mode: standalone for all cameras and expect looser timestamp alignment.
hardware:
  align_mode: hw
  color_format: RGB
  color_fps: 30
  color_size: [1280, 720]
  wait_timeout_ms: 1000
  apply_sync_config: true
  cameras:
    - id: cam0
      serial_number: "CL8T754004D"
      sync_mode: primary
    - id: cam1
      serial_number: "CL8T7540197"
      sync_mode: secondary_synced
    - id: cam2
      serial_number: "CL8T75400XA"
      sync_mode: secondary_synced

perception:
  model_config_path: configs/breastseg/breastseg_b2_inplace.py
  checkpoint_path: checkpoint/breastseg.pth
  device: cuda
  score_thr: 0.1
  topk: 5
  nms_iou: 0.5

cloud_cleanup:
  mask_erode_px: 4
  flying_depth_edge_threshold_m: 0.015
  min_depth_m: 0.25
  max_depth_m: 1.2

fusion:
  voxel_size_m: 0.002
  outlier_nb_neighbors: 20
  outlier_std_ratio: 2.0
  estimate_normals: false

surface:
  mesh_enabled: false
  poisson_depth: 8
  density_trim_quantile: 0.1
  sample_points: 80000
  normal_radius_m: 0.01
  normal_max_nn: 30
  min_points: 500

visualization:
  # Browser Cameras already streams RGB/depth previews from live_manifest outputs.
  # Keep Rerun focused on fused 3D/timing unless depth/mask/box debugging is needed.
  # RGB camera previews are intentionally not sent to Rerun.
  rerun_log_cameras: false

nipple3d:
  dbscan_eps_m: 0.005
  min_cluster_points: 30
  covariance_jitter_m2: 1.0e-8
  # In the current calibrated rig the two nipples separate mostly along world Y.
  # The assignment helper maps smaller projection to "left", so -Y makes the
  # higher-Y side consistently left.
  left_right_axis_world: [0.0, -1.0, 0.0]
  mahalanobis_threshold: 3.0

nipple_guided_fusion:
  enabled: true
  nipple_gate_m: 0.05
  reject_inconsistent_views: true
  missing_nipple_weight: 0.55
  min_consistent_weight: 0.35
  min_accepted_views: 1
  random_seed: 11

anatomy_registration:
  # Rollout modes: off -> translation_only -> nipple_init_robust_icp.
  # Anatomy-guided runs use nipple anchors as initialization and robust ICP as
  # the actual per-camera alignment correction.
  mode: nipple_init_robust_icp
  reference_camera: cam1
  min_nipple_confidence: 0.15
  side_gate_margin_m: 0.005
  max_translation_m: 0.04
  max_rotation_deg: 8.0
  residual_improvement_ratio: 1.05
  smooth_corrections: true
  correction_alpha: 0.35
  freeze_after_frames: 20
  recheck_interval_frames: 30
  freeze_translation_epsilon_m: 0.001
  freeze_rotation_epsilon_deg: 0.25
  icp_voxel_size_m: 0.006
  icp_correspondence_m: [0.05, 0.035, 0.025]
  icp_max_iterations_cold: 20
  icp_max_iterations_warm: 3
  icp_min_points: 250
  icp_min_fitness: 0.25
  icp_max_rmse_m: 0.012
  robust_kernel: tukey
  robust_kernel_k_m: 0.01

post_fusion_cleanup:
  enabled: true
  radius_outlier_enabled: true
  radius_m: 0.012
  min_neighbors: 8
  min_retained_ratio: 0.25
  dbscan_enabled: true
  dbscan_eps_m: 0.012
  dbscan_min_points: 40
  nipple_anchor_keep_radius_m: 0.035
  min_cluster_points: 800
  adjacency_distance_m: 0.02
  preserve_nipple_clusters: true

tsdf_fusion:
  enabled: false
  voxel_length_m: 0.004
  sdf_trunc_m: 0.025
  depth_trunc_m: 1.2
  color: true

quality_metrics:
  enabled: true
  surface_voxel_size_m: 0.008
  surface_max_distance_m: 0.025
  min_points: 80
  max_points_per_cloud: 1500
  temporal_window: 30
