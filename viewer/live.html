<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breast 3D — Live</title>
<link rel="stylesheet" href="active_learning.css" />
<style>
  :root { --bg:#0f1216; --panel:#171c22; --line:#2a313a; --ink:#e8edf2; --muted:#909aa6; --teal:#19b9ac; --red:#ff6464; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  .app { display:grid; grid-template-rows:auto 1fr; height:100%; }
  header { display:flex; gap:14px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:700; }
  header .stat { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  header a { margin-left:auto; color:var(--teal); font-size:12px; text-decoration:none;
    border:1px solid var(--line); padding:4px 10px; border-radius:999px; }
  header a:hover { border-color:var(--teal); }
  .main { display:grid; grid-template-columns:minmax(0,1fr) 430px; min-height:0; }
  .stage { position:relative; min-height:0; background:radial-gradient(circle at 50% 40%,#1a2026,#0c0f13); }
  .stage iframe { width:100%; height:100%; border:0; display:block; }
  .side { border-left:1px solid var(--line); overflow:auto; padding:10px; display:grid; gap:8px; align-content:start; }
  .sec-title { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:4px; }
  .pill { padding:3px 8px; border:1px solid var(--line); border-radius:999px; font-size:12px; color:var(--muted); }
  .pill.live { color:#0c0f13; background:var(--teal); border-color:var(--teal); font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Breast 3D — Live</h1>
    <span class="pill live" id="liveDot">LIVE</span>
    <span class="stat" id="stat">connecting…</span>
    <a href="replay.html">Replay →</a>
  </header>
  <div class="main">
    <div class="stage">
      <iframe id="rrFrame" title="rerun viewer" allow="cross-origin-isolated" hidden></iframe>
    </div>
    <aside class="side">
      <div class="sec-title">Active Learning</div>
      <div id="activeLearningMount"></div>
    </aside>
  </div>
</div>
<script>
"use strict";
function queryOutputBase() {
  const value = new URLSearchParams(window.location.search).get("base");
  if (!value || /^https?:\/\//i.test(value) || value.startsWith("//")) {
    return null;
  }
  return `${value.replace(/\\/g, "/").replace(/\/+$/, "")}/`;
}

const BASE = queryOutputBase() || "../runs/recon3d_live/";
const CAMS = ["cam0","cam1","cam2"];
const STALE_MANIFEST_MS = 30000;

const dom = {
  stat: document.getElementById("stat"),
  dot: document.getElementById("liveDot"),
  frame: document.getElementById("rrFrame"),
};

// active_learning.js reads this on load (cams/base) and the manifest live each frame.
window.liveReconState = { base: BASE, cams: CAMS, manifest: null };

let lastTs = 0;
let rerunMounted = false;
let currentRerunUrl = "";

function setStatus(text, isLive) {
  if (dom.stat.textContent !== text) {
    dom.stat.textContent = text;
  }
  dom.dot.classList.toggle("live", isLive);
}

function mountRerun(url) {
  const nextUrl = String(url || "").trim();
  if (!nextUrl) return false;
  if (currentRerunUrl !== nextUrl) {
    dom.frame.src = nextUrl;
    currentRerunUrl = nextUrl;
  }
  dom.frame.hidden = false;
  rerunMounted = true;
  return true;
}

function manifestAgeMs(manifest) {
  const timestamp = Number(manifest.timestamp);
  if (!Number.isFinite(timestamp) || timestamp <= 0) {
    return null;
  }
  return Date.now() - timestamp * 1000;
}

function formatAge(ageMs) {
  if (ageMs === null) return "unknown age";
  const seconds = Math.max(0, Math.round(ageMs / 1000));
  if (seconds < 60) return `${seconds}s`;
  const minutes = Math.floor(seconds / 60);
  const remainder = seconds % 60;
  return `${minutes}m ${remainder}s`;
}

function noStreamStatus(manifest, isStale, ageMs) {
  const hasRerunUrl = Object.prototype.hasOwnProperty.call(manifest, "rerun_url");
  if (!hasRerunUrl) {
    const staleText = isStale ? ` · stale ${formatAge(ageMs)}` : "";
    return `old manifest${staleText} · ${BASE}`;
  }
  if (!manifest.rerun_url && manifest.rerun_error) {
    return `rerun error · ${manifest.rerun_error}`;
  }
  if (!manifest.rerun_url) {
    return "capture running with --no-rerun";
  }
  return "";
}

function updateFrameStat(manifest) {
  if (manifest.timestamp === lastTs) return;
  lastTs = manifest.timestamp;
  const pts = Number(manifest.points || 0).toLocaleString();
  setStatus(`${pts} pts · ${manifest.fps} fps · frame ${manifest.frame}`, true);
}

async function refresh() {
  let man;
  try {
    man = await (await fetch(BASE + "live_manifest.json", { cache: "no-store" })).json();
  } catch (e) {
    setStatus(`waiting for live_recon.py · ${BASE}`, false);
    return;
  }
  window.liveReconState.manifest = man;
  const ageMs = manifestAgeMs(man);
  const isStale = ageMs !== null && ageMs > STALE_MANIFEST_MS;
  if (mountRerun(man.rerun_url)) {
    if (isStale) {
      setStatus(`stale · ${formatAge(ageMs)} · frame ${man.frame ?? "-"}`, false);
    } else {
      updateFrameStat(man);
    }
    return;
  }
  if (rerunMounted) {
    setStatus(`stream retained · ${BASE}`, false);
    return;
  }
  setStatus(noStreamStatus(man, isStale, ageMs) || "no rerun stream", false);
}

refresh();
setInterval(refresh, 700);
</script>
<script src="active_learning.js"></script>
</body>
</html>
