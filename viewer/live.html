<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recon3D Live</title>
<link rel="stylesheet" href="active_learning.css" />
<style>
  :root {
    color-scheme: dark;
    --bg: #080a0d;
    --panel: #10151b;
    --panel-2: #151b22;
    --panel-3: #1a2028;
    --line: #27313b;
    --line-strong: #3c4855;
    --ink: #edf3f7;
    --muted: #96a2ad;
    --soft: #c9d3dc;
    --mint: #20d0b5;
    --mint-soft: #133834;
    --amber: #f1bd4b;
    --coral: #ff6b72;
    --violet: #a99cff;
    --blue: #71b7ff;
    --timeline-crop: 66px;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }

  body { overflow: hidden; }

  button,
  a {
    font: inherit;
  }

  .app {
    height: 100%;
    display: grid;
    grid-template-rows: 68px minmax(0, 1fr);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .035), transparent 180px),
      var(--bg);
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto auto;
    align-items: center;
    gap: 18px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(13, 17, 22, .96);
  }

  .brand {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border: 1px solid rgba(32, 208, 181, .55);
    border-radius: 8px;
    background:
      linear-gradient(135deg, rgba(32, 208, 181, .26), rgba(113, 183, 255, .12)),
      #0f171c;
    display: grid;
    place-items: center;
    color: var(--mint);
    font-weight: 900;
    letter-spacing: 0;
  }

  .brand-title {
    min-width: 0;
    display: grid;
    gap: 2px;
  }

  h1 {
    margin: 0;
    font-size: 16px;
    line-height: 1.1;
    letter-spacing: 0;
  }

  .source-line {
    min-width: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  .top-metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(86px, auto));
    gap: 8px;
  }

  .metric {
    min-width: 86px;
    height: 48px;
    display: grid;
    align-content: center;
    gap: 3px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 255, 255, .025);
  }

  .metric span {
    color: var(--muted);
    font-size: 10px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .metric b {
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }

  .top-actions {
    display: flex;
    justify-content: end;
    align-items: center;
    gap: 8px;
  }

  .tool-button,
  .link-button {
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #121820;
    color: var(--soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 12px;
    text-decoration: none;
    cursor: pointer;
  }

  .tool-button:hover,
  .link-button:hover {
    border-color: var(--line-strong);
    color: var(--ink);
    background: #17202a;
  }

  .workspace {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 390px;
    background: #080a0d;
  }

  .viewer-pane {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 44px minmax(0, 1fr) 58px;
    border-right: 1px solid var(--line);
  }

  .viewer-head,
  .viewer-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: #0d1116;
  }

  .viewer-head {
    border-bottom: 1px solid var(--line);
    justify-content: space-between;
  }

  .viewer-foot {
    border-top: 1px solid var(--line);
    overflow: hidden;
  }

  .status-cluster {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .live-dot {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: var(--coral);
    box-shadow: 0 0 0 3px rgba(255, 107, 114, .14);
    flex: 0 0 auto;
  }

  .live-dot.live {
    background: var(--mint);
    box-shadow: 0 0 0 3px rgba(32, 208, 181, .14);
  }

  .status-text {
    min-width: 0;
    color: var(--soft);
    font-size: 13px;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .stream-label {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .rerun-viewport {
    position: relative;
    min-height: 0;
    overflow: hidden;
    background:
      linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255, 255, 255, .03) 1px, transparent 1px),
      #050607;
    background-size: 48px 48px;
  }

  .rerun-viewport iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #050607;
  }

  .rerun-viewport.timeline-hidden iframe {
    height: calc(100% + var(--timeline-crop));
  }

  .empty-state {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
    padding: 24px;
    pointer-events: none;
  }

  .empty-state[hidden] {
    display: none;
  }

  .empty-copy {
    display: grid;
    gap: 10px;
    justify-items: center;
  }

  .empty-copy b {
    color: var(--ink);
    font-size: 18px;
    letter-spacing: 0;
  }

  .empty-copy span {
    max-width: 480px;
    font-size: 13px;
    line-height: 1.5;
  }

  .camera-strip {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
  }

  .camera-chip {
    min-width: 0;
    height: 38px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #111720;
  }

  .camera-chip::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--mint);
  }

  .camera-chip b,
  .camera-chip span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .camera-chip b {
    font-size: 12px;
    color: var(--ink);
  }

  .camera-chip span {
    color: var(--muted);
    font-size: 11px;
    text-align: right;
  }

  .inspector {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    background: #0b0e12;
    padding: 12px;
    display: grid;
    gap: 10px;
    align-content: start;
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    overflow: hidden;
  }

  .panel-head {
    min-height: 38px;
    padding: 10px 11px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .panel-head b {
    font-size: 12px;
    letter-spacing: .02em;
  }

  .panel-head span {
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
  }

  .side-metric {
    min-width: 0;
    background: #10151b;
    padding: 11px;
    display: grid;
    gap: 5px;
  }

  .side-metric span {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .side-metric b {
    color: var(--ink);
    font-size: 15px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .camera-feed-list {
    display: grid;
    gap: 1px;
    background: var(--line);
  }

  .camera-feed {
    background: #10151b;
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr);
    gap: 10px;
    padding: 10px;
  }

  .feed-preview {
    position: relative;
    width: 112px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 6px;
    background: #07090c;
    border: 1px solid #1f2832;
  }

  .feed-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .feed-preview .mask {
    position: absolute;
    inset: 0;
    mix-blend-mode: screen;
    opacity: .42;
    filter: saturate(1.15);
  }

  .feed-body {
    min-width: 0;
    display: grid;
    align-content: center;
    gap: 6px;
  }

  .feed-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .feed-title b {
    font-size: 13px;
  }

  .feed-title span {
    color: var(--mint);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  .feed-meta {
    display: grid;
    gap: 4px;
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  .al-section {
    display: grid;
    gap: 8px;
  }

  .section-label {
    color: var(--muted);
    font-size: 10px;
    line-height: 1;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 2px 2px 0;
  }

  @media (max-width: 1160px) {
    .app { grid-template-rows: auto minmax(0, 1fr); }
    .topbar {
      grid-template-columns: 1fr;
      align-items: stretch;
    }
    .top-metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .top-actions {
      justify-content: start;
    }
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(520px, 1fr) auto;
      overflow: auto;
    }
    body { overflow: auto; }
    .inspector {
      overflow: visible;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .al-section {
      grid-column: 1 / -1;
    }
  }

  @media (max-width: 720px) {
    .top-metrics {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .viewer-pane {
      grid-template-rows: auto minmax(360px, 1fr) auto;
    }
    .viewer-head,
    .viewer-foot {
      align-items: stretch;
      flex-direction: column;
      padding: 10px;
    }
    .camera-strip {
      grid-template-columns: 1fr;
    }
    .inspector {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">3D</div>
      <div class="brand-title">
        <h1>Recon3D Live</h1>
        <div class="source-line" id="baseText">connecting</div>
      </div>
    </div>
    <div class="top-metrics" aria-label="Live reconstruction metrics">
      <div class="metric"><span>Frame</span><b id="frameMetric">--</b></div>
      <div class="metric"><span>Points</span><b id="pointsMetric">--</b></div>
      <div class="metric"><span>FPS</span><b id="fpsMetric">--</b></div>
      <div class="metric"><span>Drift</span><b id="driftMetric">--</b></div>
    </div>
    <div class="top-actions">
      <button class="tool-button" id="timelineToggle" type="button" aria-pressed="false">Timeline</button>
      <a class="link-button" href="replay.html">Replay</a>
    </div>
  </header>

  <main class="workspace">
    <section class="viewer-pane" aria-label="Rerun reconstruction viewer">
      <div class="viewer-head">
        <div class="status-cluster">
          <span class="live-dot" id="liveDot"></span>
          <div class="status-text" id="stat">connecting</div>
        </div>
        <div class="stream-label" id="streamLabel">rerun pending</div>
      </div>
      <div class="rerun-viewport timeline-hidden" id="rerunViewport">
        <iframe id="rrFrame" title="rerun viewer" allow="cross-origin-isolated" hidden></iframe>
        <div class="empty-state" id="emptyState">
          <div class="empty-copy">
            <b>Waiting for stream</b>
            <span id="emptyDetail">No live manifest has been published yet.</span>
          </div>
        </div>
      </div>
      <div class="viewer-foot">
        <div class="camera-strip" id="cameraStrip"></div>
      </div>
    </section>

    <aside class="inspector" aria-label="Reconstruction details">
      <section class="panel">
        <div class="panel-head">
          <b>Reconstruction</b>
          <span id="ageMetric">--</span>
        </div>
        <div class="metric-grid">
          <div class="side-metric"><span>Total</span><b id="totalMetric">--</b></div>
          <div class="side-metric"><span>Perception</span><b id="perceptionMetric">--</b></div>
          <div class="side-metric"><span>Fusion</span><b id="fusionMetric">--</b></div>
          <div class="side-metric"><span>Nipple 3D</span><b id="nippleMetric">--</b></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <b>Cameras</b>
          <span id="cameraCount">3 feeds</span>
        </div>
        <div class="camera-feed-list" id="cameraFeedList"></div>
      </section>

      <section class="al-section">
        <div class="section-label">Active Learning</div>
        <div id="activeLearningMount"></div>
      </section>
    </aside>
  </main>
</div>

<script>
"use strict";

function queryOutputBase() {
  const value = new URLSearchParams(window.location.search).get("base");
  if (!value || /^https?:\/\//i.test(value) || value.startsWith("//")) {
    return null;
  }
  return `${value.replace(/\\/g, "/").replace(/\/+$/, "")}/`;
}

const BASE = queryOutputBase() || "../runs/recon3d_live/";
const CAMS = ["cam0", "cam1", "cam2"];
const STALE_MANIFEST_MS = 30000;

const dom = {
  baseText: document.getElementById("baseText"),
  stat: document.getElementById("stat"),
  dot: document.getElementById("liveDot"),
  frame: document.getElementById("rrFrame"),
  empty: document.getElementById("emptyState"),
  emptyDetail: document.getElementById("emptyDetail"),
  viewport: document.getElementById("rerunViewport"),
  timelineToggle: document.getElementById("timelineToggle"),
  streamLabel: document.getElementById("streamLabel"),
  cameraStrip: document.getElementById("cameraStrip"),
  cameraFeedList: document.getElementById("cameraFeedList"),
  cameraCount: document.getElementById("cameraCount"),
  ageMetric: document.getElementById("ageMetric"),
  frameMetric: document.getElementById("frameMetric"),
  pointsMetric: document.getElementById("pointsMetric"),
  fpsMetric: document.getElementById("fpsMetric"),
  driftMetric: document.getElementById("driftMetric"),
  totalMetric: document.getElementById("totalMetric"),
  perceptionMetric: document.getElementById("perceptionMetric"),
  fusionMetric: document.getElementById("fusionMetric"),
  nippleMetric: document.getElementById("nippleMetric"),
};

window.liveReconState = { base: BASE, cams: CAMS, manifest: null };

let lastTs = 0;
let rerunMounted = false;
let currentRerunUrl = "";

dom.baseText.textContent = BASE;

function numberText(value, digits = 0) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "--";
  return number.toLocaleString(undefined, {
    maximumFractionDigits: digits,
    minimumFractionDigits: digits,
  });
}

function msText(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "--";
  return `${numberText(number, number >= 100 ? 0 : 1)} ms`;
}

function ageMs(manifest) {
  const timestamp = Number(manifest && manifest.timestamp);
  if (!Number.isFinite(timestamp) || timestamp <= 0) return null;
  return Date.now() - timestamp * 1000;
}

function formatAge(value) {
  if (value === null) return "--";
  const seconds = Math.max(0, Math.round(value / 1000));
  if (seconds < 60) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  return `${minutes}m ${seconds % 60}s ago`;
}

function setStatus(text, isLive) {
  if (dom.stat.textContent !== text) {
    dom.stat.textContent = text;
  }
  dom.dot.classList.toggle("live", isLive);
}

function mountRerun(url) {
  const nextUrl = String(url || "").trim();
  if (!nextUrl) return false;
  if (currentRerunUrl !== nextUrl) {
    dom.frame.src = nextUrl;
    currentRerunUrl = nextUrl;
  }
  dom.frame.hidden = false;
  dom.empty.hidden = true;
  rerunMounted = true;
  dom.streamLabel.textContent = "rerun connected";
  return true;
}

function imageUrl(path, manifest) {
  if (!path) return "";
  const stamp = Math.round(Number(manifest.timestamp || Date.now() / 1000) * 1000);
  return `${BASE}${path}?t=${stamp}`;
}

function renderCameraStrip(manifest) {
  const cameras = manifest.cameras || CAMS;
  dom.cameraStrip.innerHTML = "";
  for (const cam of cameras) {
    const perception = (manifest.perception && manifest.perception[cam]) || {};
    const maskPixels = Number(perception.mask_pixels || 0);
    const item = document.createElement("div");
    item.className = "camera-chip";
    item.innerHTML = `<b>${cam}</b><span>${numberText(maskPixels)} px</span>`;
    dom.cameraStrip.append(item);
  }
}

function renderCameraFeeds(manifest) {
  const cameras = manifest.cameras || CAMS;
  dom.cameraCount.textContent = `${cameras.length} feeds`;
  dom.cameraFeedList.innerHTML = "";
  for (const cam of cameras) {
    const perception = (manifest.perception && manifest.perception[cam]) || {};
    const display = (manifest.display && manifest.display[cam]) || {};
    const boxes = perception.nipple_boxes_xyxy || [];
    const maskPixels = Number(perception.mask_pixels || 0);
    const rgb = imageUrl(manifest.rgb && manifest.rgb[cam], manifest);
    const mask = imageUrl(manifest.mask && manifest.mask[cam], manifest);
    const row = document.createElement("div");
    row.className = "camera-feed";
    row.innerHTML = `
      <div class="feed-preview">
        ${rgb ? `<img alt="${cam} rgb" src="${rgb}">` : ""}
        ${mask ? `<img class="mask" alt="${cam} mask" src="${mask}">` : ""}
      </div>
      <div class="feed-body">
        <div class="feed-title"><b>${cam}</b><span>${boxes.length} nipple</span></div>
        <div class="feed-meta">
          <span>${numberText(maskPixels)} mask pixels</span>
          <span>${display.source_width || "--"} x ${display.source_height || "--"} source</span>
        </div>
      </div>
    `;
    dom.cameraFeedList.append(row);
  }
}

function updateMetrics(manifest) {
  const timings = manifest.timings_ms || {};
  const points = Number(manifest.points || 0);
  const frame = manifest.frame ?? "--";
  const fps = Number(manifest.fps || 0);
  const drift = Number(timings.timestamp_drift_ms);
  dom.frameMetric.textContent = String(frame);
  dom.pointsMetric.textContent = numberText(points);
  dom.fpsMetric.textContent = numberText(fps, 2);
  dom.driftMetric.textContent = Number.isFinite(drift) ? `${numberText(drift, 1)} ms` : "--";
  dom.totalMetric.textContent = msText(timings.total_ms);
  dom.perceptionMetric.textContent = msText(timings.perception_ms);
  dom.fusionMetric.textContent = msText(timings.fusion_ms);
  dom.nippleMetric.textContent = msText(timings.nipple3d_ms);
  dom.ageMetric.textContent = formatAge(ageMs(manifest));
}

function noStreamStatus(manifest, isStale, age) {
  const hasRerunUrl = Object.prototype.hasOwnProperty.call(manifest, "rerun_url");
  if (!hasRerunUrl) return isStale ? `old manifest, ${formatAge(age)}` : "old manifest";
  if (!manifest.rerun_url && manifest.rerun_error) return `rerun error: ${manifest.rerun_error}`;
  if (!manifest.rerun_url) return "capture running without rerun";
  return "no rerun stream";
}

function updateFrameStatus(manifest, isStale, age) {
  if (manifest.timestamp === lastTs && !isStale) return;
  lastTs = manifest.timestamp;
  if (isStale) {
    setStatus(`stale, frame ${manifest.frame ?? "--"}, ${formatAge(age)}`, false);
    return;
  }
  setStatus(`live, frame ${manifest.frame ?? "--"}`, true);
}

async function refresh() {
  let manifest;
  try {
    const response = await fetch(BASE + "live_manifest.json", { cache: "no-store" });
    manifest = await response.json();
  } catch (error) {
    setStatus("waiting for live manifest", false);
    dom.streamLabel.textContent = "manifest pending";
    dom.empty.hidden = false;
    dom.emptyDetail.textContent = BASE;
    return;
  }

  window.liveReconState.manifest = manifest;
  const age = ageMs(manifest);
  const isStale = age !== null && age > STALE_MANIFEST_MS;
  updateMetrics(manifest);
  renderCameraStrip(manifest);
  renderCameraFeeds(manifest);

  if (mountRerun(manifest.rerun_url)) {
    updateFrameStatus(manifest, isStale, age);
    return;
  }
  if (rerunMounted) {
    setStatus("stream retained", false);
    return;
  }
  dom.empty.hidden = false;
  dom.emptyDetail.textContent = noStreamStatus(manifest, isStale, age);
  setStatus(noStreamStatus(manifest, isStale, age), false);
}

dom.timelineToggle.addEventListener("click", () => {
  const hidden = dom.viewport.classList.toggle("timeline-hidden");
  dom.timelineToggle.setAttribute("aria-pressed", String(!hidden));
  dom.timelineToggle.textContent = hidden ? "Timeline" : "Clean View";
});

renderCameraStrip({ cameras: CAMS, perception: {} });
refresh();
setInterval(refresh, 700);
</script>
<script src="active_learning.js"></script>
</body>
</html>
