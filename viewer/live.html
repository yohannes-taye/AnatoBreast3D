<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recon3D Viewer</title>
<link rel="stylesheet" href="active_learning.css" />
<style>
  :root {
    color-scheme: dark;
    --bg: #07090c;
    --shell: #0d1117;
    --panel: #111821;
    --panel-soft: #151d27;
    --panel-strong: #1a2430;
    --line: #273241;
    --line-soft: #1f2834;
    --ink: #eef5f8;
    --soft: #c8d3dc;
    --muted: #91a0ae;
    --faint: #63717f;
    --mint: #69d7c0;
    --mint-ink: #06201b;
    --blue: #80bfff;
    --amber: #f0c15c;
    --coral: #ff7885;
    --shadow: 0 18px 52px rgba(0, 0, 0, .32);
    --timeline-crop: 66px;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }

  body { overflow: hidden; }

  button,
  select {
    font: inherit;
  }

  button:disabled,
  select:disabled {
    opacity: .48;
    cursor: not-allowed;
  }

  .app {
    height: 100%;
    min-width: 0;
    display: grid;
    grid-template-rows: 62px minmax(0, 1fr);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0) 220px),
      var(--bg);
  }

  .topbar {
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto;
    align-items: center;
    gap: 18px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(9, 12, 16, .96);
  }

  .brand {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(105, 215, 192, .55);
    border-radius: 8px;
    background: #101a21;
    color: var(--mint);
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0;
  }

  .brand-copy {
    min-width: 0;
    display: grid;
    gap: 3px;
  }

  h1 {
    margin: 0;
    color: var(--ink);
    font-size: 17px;
    line-height: 1;
    font-weight: 820;
    letter-spacing: 0;
  }

  .source-line {
    min-width: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  .top-actions {
    display: flex;
    align-items: center;
    justify-content: end;
    gap: 8px;
  }

  .tool-button {
    height: 36px;
    min-width: 78px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #111822;
    color: var(--soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 13px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }

  .tool-button:hover {
    border-color: #3b4a5d;
    background: #172130;
    color: var(--ink);
  }

  .tool-button.primary {
    border-color: rgba(105, 215, 192, .72);
    background: var(--mint);
    color: var(--mint-ink);
    font-weight: 850;
  }

  .tool-button.primary:hover {
    background: #84e5d1;
    color: var(--mint-ink);
  }

  .tool-button.danger {
    border-color: rgba(255, 120, 133, .55);
    background: #26151a;
    color: #ffb0b8;
  }

  .workspace {
    min-height: 0;
    min-width: 0;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr) 340px;
    gap: 12px;
    padding: 12px;
  }

  .left-rail,
  .right-rail {
    min-height: 0;
    min-width: 0;
    display: grid;
    gap: 10px;
    align-content: start;
    overflow: hidden;
  }

  .left-rail {
    grid-template-rows: auto auto minmax(0, 1fr);
  }

  .right-rail {
    grid-template-rows: minmax(0, 1fr) auto;
    align-content: stretch;
  }

  .stage {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 46px minmax(0, 1fr) 58px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    background: #05070a;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .stage-head,
  .stage-foot {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 13px;
    background: #0c1117;
  }

  .stage-head {
    justify-content: space-between;
    border-bottom: 1px solid var(--line-soft);
  }

  .stage-foot {
    border-top: 1px solid var(--line-soft);
    overflow: hidden;
  }

  .status-cluster {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .live-dot {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: var(--coral);
    box-shadow: 0 0 0 3px rgba(255, 120, 133, .14);
    flex: 0 0 auto;
  }

  .live-dot.live {
    background: var(--mint);
    box-shadow: 0 0 0 3px rgba(105, 215, 192, .14);
  }

  .status-text {
    min-width: 0;
    color: var(--soft);
    font-size: 13px;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .stream-label {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .rerun-viewport {
    position: relative;
    min-height: 0;
    overflow: hidden;
    background:
      linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255, 255, 255, .025) 1px, transparent 1px),
      #05070a;
    background-size: 48px 48px;
  }

  .rerun-viewport iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #05070a;
  }

  .rerun-viewport.timeline-hidden iframe {
    height: calc(100% + var(--timeline-crop));
  }

  .empty-state {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
    padding: 24px;
    pointer-events: none;
  }

  .empty-state[hidden] { display: none; }

  .empty-copy {
    display: grid;
    gap: 10px;
    justify-items: center;
  }

  .empty-copy b {
    color: var(--ink);
    font-size: 18px;
    letter-spacing: 0;
  }

  .empty-copy span {
    max-width: 520px;
    font-size: 13px;
    line-height: 1.5;
  }

  .panel {
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(17, 24, 33, .98);
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
  }

  .panel-head {
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 13px;
    border-bottom: 1px solid var(--line);
    background: #101720;
  }

  .panel-head b {
    color: var(--ink);
    font-size: 15px;
    font-weight: 820;
    line-height: 1;
    letter-spacing: 0;
  }

  .panel-head span {
    min-width: 0;
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .camera-panel {
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  .camera-panel .panel-head {
    min-height: 32px;
    padding: 0 10px;
  }

  .camera-panel .panel-head b {
    font-size: 13px;
  }

  .camera-panel .panel-head span {
    font-size: 11px;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
  }

  .side-metric {
    min-width: 0;
    min-height: 76px;
    display: grid;
    align-content: center;
    gap: 7px;
    padding: 12px;
    background: #101821;
  }

  .side-metric span {
    color: var(--muted);
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0;
  }

  .side-metric b {
    min-width: 0;
    color: var(--ink);
    font-size: 21px;
    line-height: 1;
    font-weight: 850;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }

  .replay-controls {
    display: grid;
    gap: 10px;
    padding: 12px;
    background: #101821;
  }

  .replay-field {
    min-width: 0;
    display: grid;
    gap: 6px;
  }

  .replay-field label {
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
  }

  .replay-select {
    min-width: 0;
    width: 100%;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #090e14;
    color: var(--ink);
    padding: 0 10px;
    font-size: 13px;
    outline: none;
  }

  .replay-select option {
    background: #0b1118;
    color: var(--ink);
  }

  .replay-select:focus {
    border-color: rgba(105, 215, 192, .72);
  }

  .replay-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .replay-actions .tool-button {
    width: 100%;
    min-width: 0;
  }

  .replay-meta {
    min-height: 18px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .run-summary {
    padding: 12px;
    display: grid;
    gap: 8px;
    background: #101821;
  }

  .summary-line {
    min-width: 0;
    display: grid;
    grid-template-columns: 86px minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.25;
  }

  .summary-line b {
    min-width: 0;
    color: var(--soft);
    font-size: 12px;
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .camera-strip {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .camera-chip {
    min-width: 0;
    height: 36px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    background: #101821;
  }

  .camera-chip::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--mint);
  }

  .camera-chip b,
  .camera-chip span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .camera-chip b {
    color: var(--ink);
    font-size: 12px;
  }

  .camera-chip span {
    color: var(--muted);
    font-size: 11px;
    text-align: right;
  }

  .camera-feed-list {
    min-height: 0;
    display: grid;
    grid-auto-rows: max-content;
    align-content: start;
    gap: 8px;
    padding: 8px;
    background: #0f161f;
    overflow-y: auto;
  }

  .camera-feed {
    min-width: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 4px;
    padding: 6px;
    background: #101821;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
  }

  .feed-head {
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 6px;
  }

  .feed-title {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .feed-title b {
    min-width: 0;
    color: var(--ink);
    font-size: 12px;
    line-height: 1;
    font-weight: 820;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .feed-title span {
    color: var(--mint);
    font-size: 9px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .feed-meta {
    min-width: 0;
    color: var(--muted);
    font-size: 9px;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .feed-media-grid {
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 6px;
  }

  .feed-preview {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 6px;
    background: #070b10;
    border: 1px solid #202b38;
  }

  .feed-preview.depth {
    background:
      linear-gradient(135deg, rgba(128, 191, 255, .08), rgba(105, 215, 192, .04)),
      #070b10;
  }

  .feed-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .feed-preview .mask {
    position: absolute;
    inset: 0;
    mix-blend-mode: screen;
    opacity: .42;
    filter: saturate(1.12);
  }

  .feed-preview-label {
    position: absolute;
    left: 5px;
    top: 5px;
    z-index: 2;
    height: 16px;
    display: inline-flex;
    align-items: center;
    padding: 0 6px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 999px;
    background: rgba(6, 10, 15, .72);
    color: var(--soft);
    font-size: 8px;
    line-height: 1;
    white-space: nowrap;
    backdrop-filter: blur(8px);
  }

  .feed-empty {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 9px;
    line-height: 1;
  }

  .al-section {
    display: grid;
    gap: 8px;
  }

  .section-label {
    color: var(--muted);
    font-size: 11px;
    line-height: 1;
    padding: 0 2px;
    letter-spacing: 0;
  }

  @media (max-width: 1320px) {
    .workspace {
      grid-template-columns: 280px minmax(0, 1fr);
      grid-template-rows: minmax(540px, 1fr) auto;
    }

    .right-rail {
      grid-column: 1 / -1;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .al-section {
      grid-column: 1 / -1;
    }
  }

  @media (max-width: 760px) {
    body { overflow: auto; }

    .app {
      height: auto;
      min-height: 100%;
      grid-template-rows: auto auto;
    }

    .topbar {
      grid-template-columns: 1fr;
      align-items: stretch;
    }

    .top-actions {
      justify-content: start;
      flex-wrap: wrap;
    }

    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(520px, 72vh) auto;
      overflow: visible;
    }

    .left-rail,
    .right-rail {
      overflow: visible;
    }

    .right-rail {
      grid-column: auto;
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 640px) {
    .workspace {
      padding: 8px;
      gap: 8px;
    }

    .metric-grid,
    .feed-media-grid {
      grid-template-columns: 1fr;
    }

    .feed-preview {
      aspect-ratio: 16 / 10;
    }

    .camera-strip {
      grid-template-columns: 1fr;
    }

    .stage {
      grid-template-rows: auto minmax(420px, 1fr) auto;
    }

    .stage-head,
    .stage-foot {
      align-items: stretch;
      flex-direction: column;
      padding: 10px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">3D</div>
      <div class="brand-copy">
        <h1>Recon3D Viewer</h1>
        <div class="source-line" id="baseText">connecting</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="tool-button" id="timelineToggle" type="button" aria-pressed="false">Timeline</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="left-rail" aria-label="Run controls">
      <section class="panel">
        <div class="panel-head">
          <b>Reconstruction</b>
          <span id="ageMetric">--</span>
        </div>
        <div class="metric-grid">
          <div class="side-metric"><span>Total</span><b id="totalMetric">--</b></div>
          <div class="side-metric"><span>Perception</span><b id="perceptionMetric">--</b></div>
          <div class="side-metric"><span>Fusion</span><b id="fusionMetric">--</b></div>
          <div class="side-metric"><span>Nipple 3D</span><b id="nippleMetric">--</b></div>
        </div>
        <div class="run-summary">
          <div class="summary-line"><span>Frame</span><b id="frameMetric">--</b></div>
          <div class="summary-line"><span>Points</span><b id="pointsMetric">--</b></div>
          <div class="summary-line"><span>FPS</span><b id="fpsMetric">--</b></div>
          <div class="summary-line"><span>Drift</span><b id="driftMetric">--</b></div>
        </div>
      </section>

      <section class="panel" id="replayPanel">
        <div class="panel-head">
          <b>Replay</b>
          <span id="replayStatus">idle</span>
        </div>
        <div class="replay-controls">
          <div class="replay-field">
            <label for="replaySessionSelect">Bag session</label>
            <select class="replay-select" id="replaySessionSelect" aria-label="Replay bag session">
              <option value="">Loading data/Replay sessions...</option>
            </select>
          </div>
          <div class="replay-actions">
            <button class="tool-button primary" id="startReplayButton" type="button">Start</button>
            <button class="tool-button danger" id="stopReplayButton" type="button">Stop</button>
          </div>
          <div class="replay-meta" id="replayMeta">--</div>
        </div>
      </section>
    </aside>

    <section class="stage" aria-label="Rerun reconstruction viewer">
      <div class="stage-head">
        <div class="status-cluster">
          <span class="live-dot" id="liveDot"></span>
          <div class="status-text" id="stat">connecting</div>
        </div>
        <div class="stream-label" id="streamLabel">rerun pending</div>
      </div>
      <div class="rerun-viewport timeline-hidden" id="rerunViewport">
        <iframe id="rrFrame" title="rerun viewer" allow="cross-origin-isolated" hidden></iframe>
        <div class="empty-state" id="emptyState">
          <div class="empty-copy">
            <b>Waiting for stream</b>
            <span id="emptyDetail">No live manifest has been published yet.</span>
          </div>
        </div>
      </div>
      <div class="stage-foot">
        <div class="camera-strip" id="cameraStrip"></div>
      </div>
    </section>

    <aside class="right-rail" aria-label="Camera and annotation details">
      <section class="panel camera-panel">
        <div class="panel-head">
          <b>Cameras</b>
          <span id="cameraCount">3 feeds</span>
        </div>
        <div class="camera-feed-list" id="cameraFeedList"></div>
      </section>

      <section class="al-section">
        <div class="section-label">Active Learning</div>
        <div id="activeLearningMount"></div>
      </section>
    </aside>
  </main>
</div>

<script>
"use strict";

function queryOutputBase() {
  const value = new URLSearchParams(window.location.search).get("base");
  if (!value || /^https?:\/\//i.test(value) || value.startsWith("//")) {
    return null;
  }
  return `${value.replace(/\\/g, "/").replace(/\/+$/, "")}/`;
}

const DEFAULT_BASE = queryOutputBase() || "../runs/recon3d_live/";
const CAMS = ["cam0", "cam1", "cam2"];
const STALE_MANIFEST_MS = 30000;

const dom = {
  baseText: document.getElementById("baseText"),
  stat: document.getElementById("stat"),
  dot: document.getElementById("liveDot"),
  frame: document.getElementById("rrFrame"),
  empty: document.getElementById("emptyState"),
  emptyDetail: document.getElementById("emptyDetail"),
  viewport: document.getElementById("rerunViewport"),
  timelineToggle: document.getElementById("timelineToggle"),
  streamLabel: document.getElementById("streamLabel"),
  replayPanel: document.getElementById("replayPanel"),
  replayStatus: document.getElementById("replayStatus"),
  replaySessionSelect: document.getElementById("replaySessionSelect"),
  startReplayButton: document.getElementById("startReplayButton"),
  stopReplayButton: document.getElementById("stopReplayButton"),
  replayMeta: document.getElementById("replayMeta"),
  cameraStrip: document.getElementById("cameraStrip"),
  cameraFeedList: document.getElementById("cameraFeedList"),
  cameraCount: document.getElementById("cameraCount"),
  ageMetric: document.getElementById("ageMetric"),
  frameMetric: document.getElementById("frameMetric"),
  pointsMetric: document.getElementById("pointsMetric"),
  fpsMetric: document.getElementById("fpsMetric"),
  driftMetric: document.getElementById("driftMetric"),
  totalMetric: document.getElementById("totalMetric"),
  perceptionMetric: document.getElementById("perceptionMetric"),
  fusionMetric: document.getElementById("fusionMetric"),
  nippleMetric: document.getElementById("nippleMetric"),
};

let currentBase = DEFAULT_BASE;
let lastTs = 0;
let rerunMounted = false;
let currentRerunUrl = "";
let replaySessions = [];
const REPLAY_SESSION_STORAGE_KEY = "recon3d.replaySession";

window.liveReconState = { base: currentBase, cams: CAMS, manifest: null };
dom.baseText.textContent = currentBase;

function setViewerBase(base) {
  const nextBase = `${String(base || DEFAULT_BASE).replace(/\\/g, "/").replace(/\/+$/, "")}/`;
  if (currentBase === nextBase) return;
  currentBase = nextBase;
  window.liveReconState.base = currentBase;
  dom.baseText.textContent = currentBase;
  lastTs = 0;
  rerunMounted = false;
  currentRerunUrl = "";
  dom.frame.hidden = true;
  dom.frame.removeAttribute("src");
  dom.empty.hidden = false;
  dom.emptyDetail.textContent = currentBase;
}

function numberText(value, digits = 0) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "--";
  return number.toLocaleString(undefined, {
    maximumFractionDigits: digits,
    minimumFractionDigits: digits,
  });
}

function msText(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "--";
  return `${numberText(number, number >= 100 ? 0 : 1)} ms`;
}

function secondsText(value) {
  const seconds = Number(value);
  if (!Number.isFinite(seconds)) return "--";
  if (seconds < 90) return `${numberText(seconds, 1)}s`;
  const minutes = Math.floor(seconds / 60);
  return `${minutes}m ${Math.round(seconds % 60)}s`;
}

function ageMs(manifest) {
  const timestamp = Number(manifest && manifest.timestamp);
  if (!Number.isFinite(timestamp) || timestamp <= 0) return null;
  return Date.now() - timestamp * 1000;
}

function formatAge(value) {
  if (value === null) return "--";
  const seconds = Math.max(0, Math.round(value / 1000));
  if (seconds < 60) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  return `${minutes}m ${seconds % 60}s ago`;
}

function setStatus(text, isLive) {
  if (dom.stat.textContent !== text) {
    dom.stat.textContent = text;
  }
  dom.dot.classList.toggle("live", isLive);
}

function mountRerun(url) {
  const nextUrl = String(url || "").trim();
  if (!nextUrl) return false;
  if (currentRerunUrl !== nextUrl) {
    dom.frame.src = nextUrl;
    currentRerunUrl = nextUrl;
  }
  dom.frame.hidden = false;
  dom.empty.hidden = true;
  rerunMounted = true;
  dom.streamLabel.textContent = "rerun connected";
  return true;
}

function imageUrl(path, manifest) {
  if (!path) return "";
  const stamp = Math.round(Number(manifest.timestamp || Date.now() / 1000) * 1000);
  return `${currentBase}${path}?t=${stamp}`;
}

async function fetchJson(url, options = {}) {
  const response = await fetch(url, {
    cache: "no-store",
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
    ...options,
  });
  const text = await response.text();
  let payload;
  try {
    payload = text ? JSON.parse(text) : {};
  } catch (error) {
    throw new Error("Replay API unavailable. Restart tools/serve_recon3d_viewer.py.");
  }
  if (!response.ok || payload.ok === false) {
    throw new Error(payload.error || `${response.status} ${response.statusText}`);
  }
  return payload;
}

function setReplayUnavailable(message) {
  replaySessions = [];
  dom.replaySessionSelect.innerHTML = "";
  const option = document.createElement("option");
  option.value = "";
  option.textContent = "Replay API unavailable";
  dom.replaySessionSelect.append(option);
  dom.startReplayButton.disabled = true;
  dom.stopReplayButton.disabled = true;
  dom.replayStatus.textContent = "offline";
  dom.replayMeta.textContent = message;
}

function renderReplaySessions(sessions, preferredSessionId = null) {
  const previous = dom.replaySessionSelect.value;
  replaySessions = Array.isArray(sessions) ? sessions : [];
  dom.replaySessionSelect.innerHTML = "";
  if (replaySessions.length === 0) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "No data/Replay sessions found";
    dom.replaySessionSelect.append(option);
    dom.startReplayButton.disabled = true;
    return;
  }
  for (const session of replaySessions) {
    const option = document.createElement("option");
    option.value = session.id;
    option.textContent = `${session.name} | ${session.camera_count} cams | ${secondsText(session.duration_s)}`;
    dom.replaySessionSelect.append(option);
  }
  const stored = localStorage.getItem(REPLAY_SESSION_STORAGE_KEY);
  const preferred = preferredSessionId || previous || stored;
  if (preferred && replaySessions.some((session) => session.id === preferred)) {
    dom.replaySessionSelect.value = preferred;
  }
  dom.startReplayButton.disabled = false;
}

function selectedReplaySession() {
  return replaySessions.find((session) => session.id === dom.replaySessionSelect.value) || null;
}

function replaySessionSummary(session) {
  if (!session) return "Select a recorded SDK bag session from data/Replay.";
  const state = session.completed ? "complete" : "incomplete";
  return `${session.camera_count} cameras | ${secondsText(session.duration_s)} | ${session.bag_size || "--"} | ${state}`;
}

function updateReplayUi(status) {
  renderReplaySessions(status.sessions || [], status.session || null);
  const running = Boolean(status.running);
  dom.stopReplayButton.disabled = !running;
  if (running) {
    dom.replayStatus.textContent = "running";
    dom.replayMeta.textContent = `${status.session_name || "replay"} -> ${status.output || "--"}`;
    if (status.base) setViewerBase(status.base);
    return;
  }
  if (Number.isInteger(status.returncode)) {
    dom.replayStatus.textContent = status.returncode === 0 ? "finished" : `failed ${status.returncode}`;
    dom.replayMeta.textContent = status.log ? `log: ${status.log}` : "--";
    return;
  }
  dom.replayStatus.textContent = "idle";
  dom.replayMeta.textContent =
    status.sessions && status.sessions.length ? replaySessionSummary(selectedReplaySession()) : "No data/Replay/*/session.json found.";
}

async function refreshReplayStatus() {
  try {
    const status = await fetchJson("/api/replay/status");
    updateReplayUi(status);
  } catch (error) {
    setReplayUnavailable(error.message);
  }
}

function cameraIds(manifest) {
  const seen = new Set();
  const ordered = [];
  for (const cam of [...CAMS, ...((manifest && manifest.cameras) || [])]) {
    if (!cam || seen.has(cam)) continue;
    seen.add(cam);
    ordered.push(cam);
  }
  return ordered;
}

function renderCameraStrip(manifest) {
  const cameras = cameraIds(manifest);
  dom.cameraStrip.innerHTML = "";
  for (const cam of cameras) {
    const perception = (manifest.perception && manifest.perception[cam]) || {};
    const maskPixels = Number(perception.mask_pixels || 0);
    const item = document.createElement("div");
    item.className = "camera-chip";
    item.innerHTML = `<b>${cam}</b><span>${numberText(maskPixels)} px</span>`;
    dom.cameraStrip.append(item);
  }
}

function renderCameraFeeds(manifest) {
  const cameras = cameraIds(manifest);
  dom.cameraCount.textContent = `${cameras.length} feeds`;
  dom.cameraFeedList.innerHTML = "";
  for (const cam of cameras) {
    const perception = (manifest.perception && manifest.perception[cam]) || {};
    const display = (manifest.display && manifest.display[cam]) || {};
    const boxes = perception.nipple_boxes_xyxy || [];
    const maskPixels = Number(perception.mask_pixels || 0);
    const rgb = imageUrl(manifest.rgb && manifest.rgb[cam], manifest);
    const mask = imageUrl(manifest.mask && manifest.mask[cam], manifest);
    const depth = imageUrl(manifest.depth && manifest.depth[cam], manifest);
    const row = document.createElement("div");
    row.className = "camera-feed";
    row.innerHTML = `
      <div class="feed-head">
        <div class="feed-title"><b>${cam}</b><span>${boxes.length} nipple</span></div>
        <div class="feed-meta">${numberText(maskPixels)} px · ${display.source_width || "--"} x ${display.source_height || "--"}</div>
      </div>
      <div class="feed-media-grid">
        <div class="feed-preview">
          <span class="feed-preview-label">RGB</span>
          ${rgb ? `<img alt="${cam} rgb" src="${rgb}" loading="lazy">` : `<div class="feed-empty">no rgb</div>`}
          ${mask ? `<img class="mask" alt="${cam} mask" src="${mask}">` : ""}
        </div>
        <div class="feed-preview depth">
          <span class="feed-preview-label">Depth</span>
          ${depth ? `<img alt="${cam} depth" src="${depth}" loading="lazy">` : `<div class="feed-empty">no depth</div>`}
        </div>
      </div>
    `;
    dom.cameraFeedList.append(row);
  }
}

function updateMetrics(manifest) {
  const timings = manifest.timings_ms || {};
  const points = Number(manifest.points || 0);
  const frame = manifest.frame ?? "--";
  const fps = Number(manifest.fps || 0);
  const drift = Number(timings.timestamp_drift_ms);
  dom.frameMetric.textContent = String(frame);
  dom.pointsMetric.textContent = numberText(points);
  dom.fpsMetric.textContent = numberText(fps, 2);
  dom.driftMetric.textContent = Number.isFinite(drift) ? `${numberText(drift, 1)} ms` : "--";
  dom.totalMetric.textContent = msText(timings.total_ms);
  dom.perceptionMetric.textContent = msText(timings.perception_ms);
  dom.fusionMetric.textContent = msText(timings.fusion_ms);
  dom.nippleMetric.textContent = msText(timings.nipple3d_ms);
  dom.ageMetric.textContent = formatAge(ageMs(manifest));
}

function noStreamStatus(manifest, isStale, age) {
  const hasRerunUrl = Object.prototype.hasOwnProperty.call(manifest, "rerun_url");
  if (!hasRerunUrl) return isStale ? `old manifest, ${formatAge(age)}` : "old manifest";
  if (!manifest.rerun_url && manifest.rerun_error) return `rerun error: ${manifest.rerun_error}`;
  if (!manifest.rerun_url) return "capture running without rerun";
  return "no rerun stream";
}

function updateFrameStatus(manifest, isStale, age) {
  if (manifest.timestamp === lastTs && !isStale) return;
  lastTs = manifest.timestamp;
  if (isStale) {
    setStatus(`stale, frame ${manifest.frame ?? "--"}, ${formatAge(age)}`, false);
    return;
  }
  setStatus(`live, frame ${manifest.frame ?? "--"}`, true);
}

async function refresh() {
  let manifest;
  try {
    const response = await fetch(currentBase + "live_manifest.json", { cache: "no-store" });
    manifest = await response.json();
  } catch (error) {
    setStatus("waiting for manifest", false);
    dom.streamLabel.textContent = "manifest pending";
    dom.empty.hidden = false;
    dom.emptyDetail.textContent = currentBase;
    return;
  }

  window.liveReconState.manifest = manifest;
  const age = ageMs(manifest);
  const isStale = age !== null && age > STALE_MANIFEST_MS;
  updateMetrics(manifest);
  renderCameraStrip(manifest);
  renderCameraFeeds(manifest);

  if (mountRerun(manifest.rerun_url)) {
    updateFrameStatus(manifest, isStale, age);
    return;
  }
  if (rerunMounted) {
    setStatus("stream retained", false);
    return;
  }
  dom.empty.hidden = false;
  dom.emptyDetail.textContent = noStreamStatus(manifest, isStale, age);
  setStatus(noStreamStatus(manifest, isStale, age), false);
}

dom.timelineToggle.addEventListener("click", () => {
  const hidden = dom.viewport.classList.toggle("timeline-hidden");
  dom.timelineToggle.setAttribute("aria-pressed", String(!hidden));
  dom.timelineToggle.textContent = hidden ? "Timeline" : "Clean View";
});

dom.startReplayButton.addEventListener("click", async () => {
  const session = dom.replaySessionSelect.value;
  if (!session) return;
  localStorage.setItem(REPLAY_SESSION_STORAGE_KEY, session);
  dom.replayStatus.textContent = "starting";
  dom.replayMeta.textContent = session;
  window.liveReconState.manifest = null;
  lastTs = null;
  renderCameraStrip({ cameras: [], perception: {} });
  renderCameraFeeds({ cameras: [], perception: {}, rgb: {}, mask: {}, depth: {} });
  dom.emptyDetail.textContent = "Waiting for stream";
  try {
    const status = await fetchJson("/api/replay/start", {
      method: "POST",
      body: JSON.stringify({
        session,
        rerun_web_port: 9111,
        rerun_grpc_port: 9899,
        probe_frames: 30,
        wait_timeout_ms: 5000,
      }),
    });
    updateReplayUi(status);
  } catch (error) {
    dom.replayStatus.textContent = "failed";
    dom.replayMeta.textContent = error.message;
  }
});

dom.stopReplayButton.addEventListener("click", async () => {
  dom.replayStatus.textContent = "stopping";
  try {
    const status = await fetchJson("/api/replay/stop", {
      method: "POST",
      body: "{}",
    });
    updateReplayUi(status);
  } catch (error) {
    dom.replayStatus.textContent = "failed";
    dom.replayMeta.textContent = error.message;
  }
});

dom.replaySessionSelect.addEventListener("change", () => {
  if (dom.replaySessionSelect.value) {
    localStorage.setItem(REPLAY_SESSION_STORAGE_KEY, dom.replaySessionSelect.value);
  }
  if (dom.replayStatus.textContent !== "running") {
    dom.replayMeta.textContent = replaySessionSummary(selectedReplaySession());
  }
});

renderCameraStrip({ cameras: CAMS, perception: {} });
refreshReplayStatus();
refresh();
setInterval(refreshReplayStatus, 2000);
setInterval(refresh, 700);
</script>
<script src="active_learning.js"></script>
</body>
</html>
