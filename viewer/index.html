<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breast 3D Reconstruction Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-solid: #ffffff;
      --ink: #161616;
      --muted: #646a73;
      --line: #d9dee8;
      --line-strong: #bdc6d4;
      --teal: #009c91;
      --coral: #e94f5f;
      --lime: #9fbd25;
      --amber: #d58b00;
      --shadow: 0 24px 60px rgba(16, 24, 40, 0.16);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    select,
    input {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 328px minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-width: 0;
    }

    .sidebar {
      position: relative;
      z-index: 2;
      display: flex;
      min-width: 0;
      height: 100vh;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 12px 0 40px rgba(28, 34, 44, 0.07);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      align-items: center;
      padding: 4px 2px 10px;
    }

    .brand-mark {
      position: relative;
      width: 42px;
      height: 42px;
      border: 1px solid #131313;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(0, 156, 145, 0.95), rgba(159, 189, 37, 0.96) 56%, rgba(233, 79, 95, 0.96));
      box-shadow: 0 12px 26px rgba(0, 156, 145, 0.22);
    }

    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      content: "";
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
    }

    .brand-mark::before {
      width: 10px;
      height: 10px;
      top: 10px;
      left: 10px;
    }

    .brand-mark::after {
      width: 6px;
      height: 6px;
      right: 10px;
      bottom: 11px;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.18;
      font-weight: 760;
      letter-spacing: 0;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .panel {
      display: grid;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #292d33;
      font-size: 12px;
      font-weight: 780;
      text-transform: uppercase;
    }

    .select {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel-solid);
      outline: none;
    }

    .select:focus,
    .button:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid rgba(0, 156, 145, 0.24);
      outline-offset: 2px;
    }

    .run-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mini-stat {
      min-width: 0;
      padding: 9px;
      border: 1px solid #e4e8ef;
      border-radius: 8px;
      background: rgba(246, 247, 251, 0.86);
    }

    .mini-stat b {
      display: block;
      overflow: hidden;
      color: #15181d;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-stat span {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #eef1f6;
    }

    .segment {
      min-width: 0;
      min-height: 34px;
      padding: 0 8px;
      cursor: pointer;
      color: #363b42;
      border: 0;
      border-radius: 6px;
      background: transparent;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .segment.active {
      color: #ffffff;
      background: #151515;
      box-shadow: 0 8px 16px rgba(17, 17, 17, 0.16);
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      color: #2f343a;
      font-size: 13px;
      font-weight: 680;
    }

    .range-wrap {
      display: grid;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--teal);
    }

    .switch {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 34px;
      color: #2d3238;
      font-size: 13px;
      font-weight: 680;
      cursor: pointer;
      user-select: none;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch span {
      position: relative;
      width: 42px;
      height: 24px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: #e9edf4;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .switch span::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      content: "";
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(20, 25, 30, 0.18);
      transition: transform 160ms ease;
    }

    .switch input:checked + span {
      border-color: rgba(0, 156, 145, 0.65);
      background: var(--teal);
    }

    .switch input:checked + span::after {
      transform: translateX(18px);
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .button {
      min-width: 0;
      min-height: 38px;
      padding: 0 11px;
      cursor: pointer;
      color: #161616;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #ffffff;
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    .button:hover {
      border-color: #a7b1c0;
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.09);
      transform: translateY(-1px);
    }

    .button.primary {
      color: #ffffff;
      border-color: #141414;
      background: #151515;
    }

    .file-grid {
      display: grid;
      gap: 8px;
    }

    .file-grid label {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      color: #343941;
      font-size: 12px;
      font-weight: 740;
    }

    .file-grid input[type="file"] {
      width: 100%;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(rgba(30, 36, 45, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 36, 45, 0.045) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, #ffffff 0, #f6f8fb 48%, #e9edf3 100%);
      background-size: 34px 34px, 34px 34px, 100% 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .topbar {
      position: absolute;
      top: 16px;
      right: 18px;
      left: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .status-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      max-width: 280px;
      padding: 0 11px;
      overflow: hidden;
      border: 1px solid rgba(188, 197, 210, 0.82);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 28px rgba(20, 28, 38, 0.08);
      color: #242a30;
      font-size: 12px;
      font-weight: 760;
      text-overflow: ellipsis;
      white-space: nowrap;
      backdrop-filter: blur(16px);
    }

    .chip.good {
      border-color: rgba(0, 156, 145, 0.4);
      color: #006f67;
    }

    .chip.warn {
      border-color: rgba(213, 139, 0, 0.42);
      color: #8b5d00;
    }

    .metric-dock {
      position: absolute;
      right: 18px;
      bottom: 18px;
      left: 18px;
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      pointer-events: none;
    }

    .metric {
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid rgba(200, 207, 218, 0.86);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 16px 42px rgba(20, 28, 38, 0.11);
      backdrop-filter: blur(16px);
    }

    .metric strong {
      display: block;
      overflow: hidden;
      color: #111111;
      font-size: 19px;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric span {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nipple-dock {
      position: absolute;
      top: 68px;
      right: 18px;
      display: grid;
      width: min(360px, calc(100% - 36px));
      gap: 8px;
      pointer-events: none;
    }

    .nipple-row {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 10px;
      align-items: center;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(200, 207, 218, 0.86);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 16px 42px rgba(20, 28, 38, 0.1);
      backdrop-filter: blur(16px);
    }

    .nipple-side {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #191919;
      font-size: 13px;
      font-weight: 780;
      text-transform: capitalize;
    }

    .dot {
      width: 11px;
      height: 11px;
      flex: 0 0 auto;
      border-radius: 999px;
      box-shadow: 0 0 0 4px rgba(0, 156, 145, 0.12);
    }

    .dot.left {
      background: var(--teal);
    }

    .dot.right {
      background: var(--coral);
      box-shadow: 0 0 0 4px rgba(233, 79, 95, 0.12);
    }

    .nipple-row code {
      display: block;
      overflow: hidden;
      color: #3f464f;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(246, 247, 251, 0.72);
      color: #161616;
      font-size: 15px;
      font-weight: 760;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      backdrop-filter: blur(8px);
    }

    .loading.show {
      opacity: 1;
      pointer-events: auto;
    }

    .loading.error {
      color: #9a2734;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .sidebar {
        height: auto;
        max-height: 45vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .metric-dock {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }

      .nipple-dock {
        top: auto;
        right: 18px;
        bottom: 190px;
        left: 18px;
        width: auto;
      }
    }

    @media (max-width: 640px) {
      .run-meta,
      .button-row,
      .segmented {
        grid-template-columns: 1fr;
      }

      .metric-dock {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Viewer controls">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>Breast 3D Reconstruction</h1>
          <p>RGB-D fusion viewer</p>
        </div>
      </div>

      <section class="panel">
        <div class="panel-title">Result</div>
        <select class="select" id="runSelect" aria-label="Select reconstruction result"></select>
        <div class="run-meta">
          <div class="mini-stat"><b id="metaPoints">-</b><span>points</span></div>
          <div class="mini-stat"><b id="metaLatency">-</b><span>latency</span></div>
          <div class="mini-stat"><b id="metaDepth">-</b><span>depth span</span></div>
          <div class="mini-stat"><b id="metaMode">-</b><span>calibration</span></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Color</div>
        <div class="segmented" id="colorMode">
          <button class="segment active" type="button" data-mode="rgb">RGB</button>
          <button class="segment" type="button" data-mode="depth">Depth</button>
          <button class="segment" type="button" data-mode="height">Height</button>
        </div>
        <div class="range-wrap">
          <div class="control-row">
            <label for="pointSize">Point size</label>
            <output id="pointSizeValue" for="pointSize">2.4</output>
          </div>
          <input id="pointSize" type="range" min="1" max="8" step="0.1" value="2.4" />
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Display</div>
        <label class="switch">
          <input id="showNipples" type="checkbox" checked />
          <span aria-hidden="true"></span>
          Nipple markers
        </label>
        <label class="switch">
          <input id="showGrid" type="checkbox" checked />
          <span aria-hidden="true"></span>
          Metric grid
        </label>
        <label class="switch">
          <input id="showAxes" type="checkbox" checked />
          <span aria-hidden="true"></span>
          World axes
        </label>
        <label class="switch">
          <input id="autoRotate" type="checkbox" />
          <span aria-hidden="true"></span>
          Auto rotate
        </label>
        <label class="switch">
          <input id="liveRefresh" type="checkbox" checked />
          <span aria-hidden="true"></span>
          Live refresh
        </label>
      </section>

      <section class="panel">
        <div class="panel-title">View</div>
        <div class="button-row">
          <button class="button primary" type="button" id="fitBtn">Fit view</button>
          <button class="button" type="button" id="resetBtn">Reset</button>
          <button class="button" type="button" id="topBtn">Top</button>
          <button class="button" type="button" id="captureBtn">Capture</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Import</div>
        <div class="file-grid">
          <label>
            PLY
            <input id="localPly" type="file" accept=".ply" />
          </label>
          <label>
            Summary
            <input id="localSummary" type="file" accept=".json" />
          </label>
          <label>
            Nipples
            <input id="localNipples" type="file" accept=".json" />
          </label>
        </div>
        <button class="button" type="button" id="loadLocalBtn">Load local result</button>
      </section>
    </aside>

    <main class="stage">
      <canvas id="glCanvas" aria-label="3D point cloud viewport"></canvas>
      <div class="topbar">
        <div class="status-group">
          <div class="chip good" id="statusRun">Loading</div>
          <div class="chip" id="statusBounds">-</div>
          <div class="chip warn" id="statusNote">-</div>
        </div>
      </div>
      <div class="nipple-dock" id="nippleDock"></div>
      <div class="metric-dock">
        <div class="metric"><strong id="metricPoints">-</strong><span>cloud points</span></div>
        <div class="metric"><strong id="metricTotal">-</strong><span>total time</span></div>
        <div class="metric"><strong id="metricPerception">-</strong><span>perception</span></div>
        <div class="metric"><strong id="metricFusion">-</strong><span>fusion</span></div>
        <div class="metric"><strong id="metricDrift">-</strong><span>timestamp drift</span></div>
      </div>
      <div class="loading show" id="loading">Loading reconstruction</div>
    </main>
  </div>

  <script>
    "use strict";

    function queryOutputBase() {
      const value = new URLSearchParams(window.location.search).get("base");
      if (!value || /^https?:\/\//i.test(value) || value.startsWith("//")) {
        return null;
      }
      return `${value.replace(/\\/g, "/").replace(/\/+$/, "")}/`;
    }

    const ACTIVE_OUTPUT_BASE = queryOutputBase();
    const RUNS = [
      ...(ACTIVE_OUTPUT_BASE ? [{
        id: "current",
        label: "Current pipeline output",
        base: ACTIVE_OUTPUT_BASE,
        cameras: "configured cameras",
        calibration: "configured extrinsics"
      }] : []),
      {
        id: "recon3d_live",
        label: "Live three-camera reconstruction",
        base: "../runs/recon3d_live/",
        cameras: "cam0 + cam1 + cam2",
        calibration: "extrinsics.json"
      },
      {
        id: "latest",
        label: "Latest exported reconstruction",
        base: "../runs/latest/",
        cameras: "configured cameras",
        calibration: "configured extrinsics"
      }
    ];

    const TYPE_READERS = {
      char: { size: 1, read: (view, offset) => view.getInt8(offset) },
      int8: { size: 1, read: (view, offset) => view.getInt8(offset) },
      uchar: { size: 1, read: (view, offset) => view.getUint8(offset) },
      uint8: { size: 1, read: (view, offset) => view.getUint8(offset) },
      short: { size: 2, read: (view, offset) => view.getInt16(offset, true) },
      int16: { size: 2, read: (view, offset) => view.getInt16(offset, true) },
      ushort: { size: 2, read: (view, offset) => view.getUint16(offset, true) },
      uint16: { size: 2, read: (view, offset) => view.getUint16(offset, true) },
      int: { size: 4, read: (view, offset) => view.getInt32(offset, true) },
      int32: { size: 4, read: (view, offset) => view.getInt32(offset, true) },
      uint: { size: 4, read: (view, offset) => view.getUint32(offset, true) },
      uint32: { size: 4, read: (view, offset) => view.getUint32(offset, true) },
      float: { size: 4, read: (view, offset) => view.getFloat32(offset, true) },
      float32: { size: 4, read: (view, offset) => view.getFloat32(offset, true) },
      double: { size: 8, read: (view, offset) => view.getFloat64(offset, true) },
      float64: { size: 8, read: (view, offset) => view.getFloat64(offset, true) }
    };

    const dom = {
      canvas: document.getElementById("glCanvas"),
      loading: document.getElementById("loading"),
      runSelect: document.getElementById("runSelect"),
      pointSize: document.getElementById("pointSize"),
      pointSizeValue: document.getElementById("pointSizeValue"),
      showNipples: document.getElementById("showNipples"),
      showGrid: document.getElementById("showGrid"),
      showAxes: document.getElementById("showAxes"),
      autoRotate: document.getElementById("autoRotate"),
      liveRefresh: document.getElementById("liveRefresh"),
      fitBtn: document.getElementById("fitBtn"),
      resetBtn: document.getElementById("resetBtn"),
      topBtn: document.getElementById("topBtn"),
      captureBtn: document.getElementById("captureBtn"),
      loadLocalBtn: document.getElementById("loadLocalBtn"),
      localPly: document.getElementById("localPly"),
      localSummary: document.getElementById("localSummary"),
      localNipples: document.getElementById("localNipples"),
      nippleDock: document.getElementById("nippleDock"),
      statusRun: document.getElementById("statusRun"),
      statusBounds: document.getElementById("statusBounds"),
      statusNote: document.getElementById("statusNote"),
      metaPoints: document.getElementById("metaPoints"),
      metaLatency: document.getElementById("metaLatency"),
      metaDepth: document.getElementById("metaDepth"),
      metaMode: document.getElementById("metaMode"),
      metricPoints: document.getElementById("metricPoints"),
      metricTotal: document.getElementById("metricTotal"),
      metricPerception: document.getElementById("metricPerception"),
      metricFusion: document.getElementById("metricFusion"),
      metricDrift: document.getElementById("metricDrift")
    };

    const state = {
      gl: null,
      program: null,
      buffers: {},
      cloud: null,
      summary: null,
      nipples: [],
      activeRun: RUNS[0],
      colorMode: "rgb",
      showNipples: true,
      showGrid: true,
      showAxes: true,
      autoRotate: false,
      liveRefresh: true,
      refreshTimer: null,
      loadingRun: false,
      pointSize: 2.4,
      camera: {
        yaw: -0.76,
        pitch: 0.48,
        distance: 1.0,
        target: [0, 0, 0]
      },
      pointer: {
        active: false,
        lastX: 0,
        lastY: 0
      }
    };

    function setLoading(message, isError = false) {
      dom.loading.textContent = message;
      dom.loading.classList.toggle("show", Boolean(message));
      dom.loading.classList.toggle("error", isError);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) {
        return "-";
      }
      return new Intl.NumberFormat("en-US").format(Math.round(value));
    }

    function formatMs(value) {
      if (!Number.isFinite(value)) {
        return "-";
      }
      return `${Math.round(value)} ms`;
    }

    function formatMm(value) {
      if (!Number.isFinite(value)) {
        return "-";
      }
      return `${Math.round(value * 1000)} mm`;
    }

    function mat4Multiply(a, b) {
      const out = new Float32Array(16);
      for (let col = 0; col < 4; col += 1) {
        for (let row = 0; row < 4; row += 1) {
          out[col * 4 + row] =
            a[0 * 4 + row] * b[col * 4 + 0] +
            a[1 * 4 + row] * b[col * 4 + 1] +
            a[2 * 4 + row] * b[col * 4 + 2] +
            a[3 * 4 + row] * b[col * 4 + 3];
        }
      }
      return out;
    }

    function mat4Perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ]);
    }

    function vec3Sub(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function vec3Cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function vec3Dot(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function vec3Normalize(v) {
      const length = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / length, v[1] / length, v[2] / length];
    }

    function mat4LookAt(eye, center, up) {
      const z = vec3Normalize(vec3Sub(eye, center));
      const x = vec3Normalize(vec3Cross(up, z));
      const y = vec3Cross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -vec3Dot(x, eye), -vec3Dot(y, eye), -vec3Dot(z, eye), 1
      ]);
    }

    function compileShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(log || "Shader compile failed");
      }
      return shader;
    }

    function createProgram(gl) {
      const vertex = compileShader(gl, gl.VERTEX_SHADER, `
        attribute vec3 aPosition;
        attribute vec3 aColor;
        uniform mat4 uMvp;
        uniform float uPointSize;
        varying vec3 vColor;
        void main() {
          gl_Position = uMvp * vec4(aPosition, 1.0);
          gl_PointSize = uPointSize;
          vColor = aColor;
        }
      `);
      const fragment = compileShader(gl, gl.FRAGMENT_SHADER, `
        precision mediump float;
        varying vec3 vColor;
        void main() {
          vec2 uv = gl_PointCoord - vec2(0.5);
          float d = dot(uv, uv);
          if (d > 0.25) {
            discard;
          }
          float rim = smoothstep(0.25, 0.03, d);
          gl_FragColor = vec4(vColor * (0.72 + 0.28 * rim), 0.96);
        }
      `);
      const program = gl.createProgram();
      gl.attachShader(program, vertex);
      gl.attachShader(program, fragment);
      gl.linkProgram(program);
      gl.deleteShader(vertex);
      gl.deleteShader(fragment);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const log = gl.getProgramInfoLog(program);
        gl.deleteProgram(program);
        throw new Error(log || "Program link failed");
      }
      return {
        id: program,
        aPosition: gl.getAttribLocation(program, "aPosition"),
        aColor: gl.getAttribLocation(program, "aColor"),
        uMvp: gl.getUniformLocation(program, "uMvp"),
        uPointSize: gl.getUniformLocation(program, "uPointSize")
      };
    }

    function initWebGL() {
      const gl = dom.canvas.getContext("webgl", {
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true
      });
      if (!gl) {
        throw new Error("WebGL is not available in this browser");
      }
      state.gl = gl;
      state.program = createProgram(gl);
      state.buffers.cloudPosition = gl.createBuffer();
      state.buffers.cloudColor = gl.createBuffer();
      state.buffers.linePosition = gl.createBuffer();
      state.buffers.lineColor = gl.createBuffer();
      state.buffers.nipplePosition = gl.createBuffer();
      state.buffers.nippleColor = gl.createBuffer();
      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    }

    function findHeaderEnd(bytes) {
      const needle = [101, 110, 100, 95, 104, 101, 97, 100, 101, 114];
      for (let i = 0; i <= bytes.length - needle.length; i += 1) {
        let matched = true;
        for (let j = 0; j < needle.length; j += 1) {
          if (bytes[i + j] !== needle[j]) {
            matched = false;
            break;
          }
        }
        if (matched) {
          let end = i + needle.length;
          while (end < bytes.length && bytes[end] !== 10) {
            end += 1;
          }
          return end + 1;
        }
      }
      return -1;
    }

    function parsePly(buffer) {
      const bytes = new Uint8Array(buffer);
      const headerEnd = findHeaderEnd(bytes);
      if (headerEnd < 0) {
        throw new Error("PLY header is incomplete");
      }
      const header = new TextDecoder("ascii").decode(bytes.slice(0, headerEnd));
      const lines = header.trim().split(/\r?\n/);
      if (lines[0] !== "ply") {
        throw new Error("File is not a PLY point cloud");
      }
      if (!lines.some((line) => line.trim() === "format binary_little_endian 1.0")) {
        throw new Error("Only binary_little_endian PLY is supported");
      }

      let vertexCount = 0;
      let inVertex = false;
      const props = [];
      for (const line of lines) {
        const parts = line.trim().split(/\s+/);
        if (parts[0] === "element") {
          inVertex = parts[1] === "vertex";
          if (inVertex) {
            vertexCount = Number(parts[2]);
          }
          continue;
        }
        if (inVertex && parts[0] === "property" && parts[1] !== "list") {
          const type = parts[1].toLowerCase();
          const name = parts[2].toLowerCase();
          const reader = TYPE_READERS[type];
          if (!reader) {
            throw new Error(`Unsupported PLY property type: ${type}`);
          }
          props.push({ type, name, size: reader.size, read: reader.read, offset: 0 });
        }
      }
      if (!vertexCount || props.length === 0) {
        throw new Error("PLY contains no vertices");
      }

      let stride = 0;
      for (const prop of props) {
        prop.offset = stride;
        stride += prop.size;
      }
      const needed = headerEnd + stride * vertexCount;
      if (needed > buffer.byteLength) {
        throw new Error("PLY vertex buffer is truncated");
      }

      const view = new DataView(buffer);
      const positions = new Float32Array(vertexCount * 3);
      const rgb = new Float32Array(vertexCount * 3);
      const bounds = {
        min: [Infinity, Infinity, Infinity],
        max: [-Infinity, -Infinity, -Infinity]
      };
      const index = Object.fromEntries(props.map((prop) => [prop.name, prop]));
      const xProp = index.x;
      const yProp = index.y;
      const zProp = index.z;
      if (!xProp || !yProp || !zProp) {
        throw new Error("PLY vertices must include x, y, z");
      }

      const redProp = index.red || index.r;
      const greenProp = index.green || index.g;
      const blueProp = index.blue || index.b;

      for (let i = 0; i < vertexCount; i += 1) {
        const base = headerEnd + i * stride;
        const x = xProp.read(view, base + xProp.offset);
        const y = yProp.read(view, base + yProp.offset);
        const z = zProp.read(view, base + zProp.offset);
        positions[i * 3 + 0] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;
        bounds.min[0] = Math.min(bounds.min[0], x);
        bounds.min[1] = Math.min(bounds.min[1], y);
        bounds.min[2] = Math.min(bounds.min[2], z);
        bounds.max[0] = Math.max(bounds.max[0], x);
        bounds.max[1] = Math.max(bounds.max[1], y);
        bounds.max[2] = Math.max(bounds.max[2], z);

        if (redProp && greenProp && blueProp) {
          rgb[i * 3 + 0] = redProp.read(view, base + redProp.offset) / 255;
          rgb[i * 3 + 1] = greenProp.read(view, base + greenProp.offset) / 255;
          rgb[i * 3 + 2] = blueProp.read(view, base + blueProp.offset) / 255;
        } else {
          rgb[i * 3 + 0] = 0.0;
          rgb[i * 3 + 1] = 0.62;
          rgb[i * 3 + 2] = 0.57;
        }
      }
      return { positions, rgb, colors: new Float32Array(rgb), bounds, count: vertexCount };
    }

    function palette(t) {
      const stops = [
        [0.0, [0.08, 0.11, 0.12]],
        [0.28, [0.0, 0.61, 0.57]],
        [0.55, [0.62, 0.74, 0.15]],
        [0.78, [0.96, 0.72, 0.20]],
        [1.0, [0.91, 0.31, 0.37]]
      ];
      const value = clamp(t, 0, 1);
      for (let i = 0; i < stops.length - 1; i += 1) {
        const left = stops[i];
        const right = stops[i + 1];
        if (value >= left[0] && value <= right[0]) {
          const local = (value - left[0]) / (right[0] - left[0] || 1);
          return [
            lerp(left[1][0], right[1][0], local),
            lerp(left[1][1], right[1][1], local),
            lerp(left[1][2], right[1][2], local)
          ];
        }
      }
      return stops[stops.length - 1][1];
    }

    function updateCloudColors() {
      if (!state.cloud) {
        return;
      }
      const cloud = state.cloud;
      if (state.colorMode === "rgb") {
        cloud.colors.set(cloud.rgb);
      } else {
        const axis = state.colorMode === "depth" ? 2 : 1;
        const min = cloud.bounds.min[axis];
        const span = Math.max(1e-8, cloud.bounds.max[axis] - min);
        for (let i = 0; i < cloud.count; i += 1) {
          const t = (cloud.positions[i * 3 + axis] - min) / span;
          const c = palette(t);
          cloud.colors[i * 3 + 0] = c[0];
          cloud.colors[i * 3 + 1] = c[1];
          cloud.colors[i * 3 + 2] = c[2];
        }
      }
      uploadCloudBuffers();
    }

    function buildLineGeometry(bounds) {
      const min = bounds.min;
      const max = bounds.max;
      const spanX = Math.max(0.08, max[0] - min[0]);
      const spanY = Math.max(0.08, max[1] - min[1]);
      const spanZ = Math.max(0.08, max[2] - min[2]);
      const padX = spanX * 0.22;
      const padY = spanY * 0.22;
      const z = min[2] - spanZ * 0.05;
      const x0 = min[0] - padX;
      const x1 = max[0] + padX;
      const y0 = min[1] - padY;
      const y1 = max[1] + padY;
      const center = [
        (min[0] + max[0]) / 2,
        (min[1] + max[1]) / 2,
        (min[2] + max[2]) / 2
      ];
      const positions = [];
      const colors = [];

      function pushLine(a, b, color) {
        positions.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        colors.push(color[0], color[1], color[2], color[0], color[1], color[2]);
      }

      const gridColor = [0.72, 0.75, 0.78];
      for (let i = 0; i <= 12; i += 1) {
        const t = i / 12;
        const x = lerp(x0, x1, t);
        const y = lerp(y0, y1, t);
        pushLine([x, y0, z], [x, y1, z], gridColor);
        pushLine([x0, y, z], [x1, y, z], gridColor);
      }

      const axisLength = Math.max(spanX, spanY, spanZ) * 0.72;
      pushLine(center, [center[0] + axisLength, center[1], center[2]], [0.0, 0.61, 0.57]);
      pushLine(center, [center[0], center[1] + axisLength, center[2]], [0.91, 0.31, 0.37]);
      pushLine(center, [center[0], center[1], center[2] + axisLength], [0.62, 0.74, 0.15]);
      return {
        positions: new Float32Array(positions),
        colors: new Float32Array(colors),
        gridCount: 52,
        totalCount: positions.length / 3
      };
    }

    function parseNipples(json) {
      if (!json || typeof json !== "object") {
        return [];
      }
      return Object.entries(json)
        .filter(([, value]) => value && Array.isArray(value.mean_world_m))
        .map(([side, value]) => ({
          side,
          point: value.mean_world_m.map(Number),
          confidence: Number(value.confidence || 0),
          usedCameras: Array.isArray(value.used_cameras) ? value.used_cameras : []
        }));
    }

    function uploadCloudBuffers() {
      const gl = state.gl;
      if (!gl || !state.cloud) {
        return;
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, state.buffers.cloudPosition);
      gl.bufferData(gl.ARRAY_BUFFER, state.cloud.positions, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, state.buffers.cloudColor);
      gl.bufferData(gl.ARRAY_BUFFER, state.cloud.colors, gl.STATIC_DRAW);
    }

    function uploadLineBuffers() {
      const gl = state.gl;
      if (!gl || !state.cloud) {
        return;
      }
      state.lines = buildLineGeometry(state.cloud.bounds);
      gl.bindBuffer(gl.ARRAY_BUFFER, state.buffers.linePosition);
      gl.bufferData(gl.ARRAY_BUFFER, state.lines.positions, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, state.buffers.lineColor);
      gl.bufferData(gl.ARRAY_BUFFER, state.lines.colors, gl.STATIC_DRAW);
    }

    function uploadNippleBuffers() {
      const gl = state.gl;
      if (!gl) {
        return;
      }
      const positions = [];
      const colors = [];
      for (const nipple of state.nipples) {
        const isLeft = nipple.side.toLowerCase() === "left";
        const color = isLeft ? [0.0, 0.61, 0.57] : [0.91, 0.31, 0.37];
        positions.push(nipple.point[0], nipple.point[1], nipple.point[2]);
        colors.push(color[0], color[1], color[2]);
      }
      state.nippleRenderCount = positions.length / 3;
      gl.bindBuffer(gl.ARRAY_BUFFER, state.buffers.nipplePosition);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, state.buffers.nippleColor);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);
    }

    function bindAttributes(positionBuffer, colorBuffer) {
      const gl = state.gl;
      const program = state.program;
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.enableVertexAttribArray(program.aPosition);
      gl.vertexAttribPointer(program.aPosition, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.enableVertexAttribArray(program.aColor);
      gl.vertexAttribPointer(program.aColor, 3, gl.FLOAT, false, 0, 0);
    }

    function fitCamera() {
      if (!state.cloud) {
        return;
      }
      const min = state.cloud.bounds.min;
      const max = state.cloud.bounds.max;
      const center = [
        (min[0] + max[0]) / 2,
        (min[1] + max[1]) / 2,
        (min[2] + max[2]) / 2
      ];
      const radius = Math.max(
        0.08,
        Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 2
      );
      state.camera.target = center;
      state.camera.distance = radius * 3.25;
    }

    function resetCamera() {
      state.camera.yaw = -0.76;
      state.camera.pitch = 0.48;
      fitCamera();
    }

    function topCamera() {
      state.camera.yaw = 0.0;
      state.camera.pitch = 1.22;
      fitCamera();
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.floor(dom.canvas.clientWidth * dpr));
      const height = Math.max(1, Math.floor(dom.canvas.clientHeight * dpr));
      if (dom.canvas.width !== width || dom.canvas.height !== height) {
        dom.canvas.width = width;
        dom.canvas.height = height;
      }
    }

    function render() {
      requestAnimationFrame(render);
      const gl = state.gl;
      if (!gl) {
        return;
      }
      resizeCanvas();
      const width = dom.canvas.width;
      const height = dom.canvas.height;
      gl.viewport(0, 0, width, height);
      gl.clearColor(0.965, 0.973, 0.985, 0.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      if (!state.cloud) {
        return;
      }

      if (state.autoRotate) {
        state.camera.yaw += 0.003;
      }

      const target = state.camera.target;
      const d = state.camera.distance;
      const pitch = state.camera.pitch;
      const yaw = state.camera.yaw;
      const eye = [
        target[0] + d * Math.cos(pitch) * Math.sin(yaw),
        target[1] - d * Math.cos(pitch) * Math.cos(yaw),
        target[2] + d * Math.sin(pitch)
      ];
      const view = mat4LookAt(eye, target, [0, 0, 1]);
      const projection = mat4Perspective(Math.PI / 4.2, width / height, 0.005, 12.0);
      const mvp = mat4Multiply(projection, view);

      const program = state.program;
      gl.useProgram(program.id);
      gl.uniformMatrix4fv(program.uMvp, false, mvp);

      if (state.lines && (state.showGrid || state.showAxes)) {
        bindAttributes(state.buffers.linePosition, state.buffers.lineColor);
        gl.uniform1f(program.uPointSize, 1.0);
        if (state.showGrid) {
          gl.drawArrays(gl.LINES, 0, state.lines.gridCount);
        }
        if (state.showAxes) {
          gl.drawArrays(gl.LINES, state.lines.gridCount, state.lines.totalCount - state.lines.gridCount);
        }
      }

      bindAttributes(state.buffers.cloudPosition, state.buffers.cloudColor);
      gl.uniform1f(program.uPointSize, state.pointSize * Math.min(window.devicePixelRatio || 1, 2));
      gl.drawArrays(gl.POINTS, 0, state.cloud.count);

      if (state.showNipples && state.nippleRenderCount) {
        bindAttributes(state.buffers.nipplePosition, state.buffers.nippleColor);
        gl.uniform1f(program.uPointSize, 16 * Math.min(window.devicePixelRatio || 1, 2));
        gl.drawArrays(gl.POINTS, 0, state.nippleRenderCount);
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${response.status} ${url}`);
      }
      return response.json();
    }

    async function loadRun(run, options = {}) {
      if (state.loadingRun) {
        return;
      }
      state.loadingRun = true;
      state.activeRun = run;
      if (!options.silent) {
        setLoading("Loading reconstruction");
      }
      try {
        const [plyResponse, summary, nipplesJson] = await Promise.all([
          fetch(`${run.base}fused_breast.ply`, { cache: "no-store" }),
          fetchJson(`${run.base}run_summary.json`),
          fetchJson(`${run.base}nipple_world.json`)
        ]);
        if (!plyResponse.ok) {
          throw new Error(`${plyResponse.status} ${run.base}fused_breast.ply`);
        }
        const buffer = await plyResponse.arrayBuffer();
        state.cloud = parsePly(buffer);
        state.summary = summary;
        state.nipples = parseNipples(nipplesJson);
        updateCloudColors();
        uploadLineBuffers();
        uploadNippleBuffers();
        resetCamera();
        updateUi();
        setLoading("");
      } catch (error) {
        if (!options.silent) {
          setLoading(`No formal reconstruction found: ${error.message}`, true);
        }
      } finally {
        state.loadingRun = false;
      }
    }

    function setLiveRefresh(enabled) {
      state.liveRefresh = enabled;
      if (state.refreshTimer) {
        clearInterval(state.refreshTimer);
        state.refreshTimer = null;
      }
      if (enabled) {
        state.refreshTimer = setInterval(() => {
          loadRun(state.activeRun, { silent: true });
        }, 3000);
      }
    }

    async function loadLocalResult() {
      if (!dom.localPly.files.length) {
        setLoading("Choose a PLY file first", true);
        return;
      }
      setLoading("Loading local result");
      try {
        const buffer = await dom.localPly.files[0].arrayBuffer();
        const summary = dom.localSummary.files.length
          ? JSON.parse(await dom.localSummary.files[0].text())
          : null;
        const nippleJson = dom.localNipples.files.length
          ? JSON.parse(await dom.localNipples.files[0].text())
          : null;
        state.activeRun = {
          id: "local",
          label: dom.localPly.files[0].name,
          cameras: "local",
          calibration: "local"
        };
        state.cloud = parsePly(buffer);
        state.summary = summary;
        state.nipples = parseNipples(nippleJson);
        updateCloudColors();
        uploadLineBuffers();
        uploadNippleBuffers();
        resetCamera();
        updateUi();
        setLoading("");
      } catch (error) {
        setLoading(`Could not load local result: ${error.message}`, true);
      }
    }

    function updateUi() {
      const cloud = state.cloud;
      const summary = state.summary || {};
      const timings = summary.timings_ms || {};
      const bounds = cloud ? cloud.bounds : { min: [0, 0, 0], max: [0, 0, 0] };
      const points = cloud ? cloud.count : 0;
      const depthSpan = cloud ? bounds.max[2] - bounds.min[2] : NaN;
      const totalMs = Number(timings.total_ms ?? summary.metrics?.single_frame_latency_ms);

      dom.statusRun.textContent = `${state.activeRun.label} | ${state.activeRun.cameras}`;
      dom.statusBounds.textContent = cloud
        ? `Bounds ${formatMm(bounds.max[0] - bounds.min[0])} x ${formatMm(bounds.max[1] - bounds.min[1])} x ${formatMm(bounds.max[2] - bounds.min[2])}`
        : "-";
      dom.statusNote.textContent = `Calibration: ${state.activeRun.calibration}`;

      dom.metaPoints.textContent = formatNumber(points);
      dom.metaLatency.textContent = formatMs(totalMs);
      dom.metaDepth.textContent = formatMm(depthSpan);
      dom.metaMode.textContent = state.activeRun.calibration;

      dom.metricPoints.textContent = formatNumber(points);
      dom.metricTotal.textContent = formatMs(totalMs);
      dom.metricPerception.textContent = formatMs(Number(timings.perception_ms));
      dom.metricFusion.textContent = formatMs(Number(timings.fusion_ms));
      dom.metricDrift.textContent = formatMs(Number(timings.timestamp_drift_ms));
      dom.pointSizeValue.textContent = state.pointSize.toFixed(1);

      dom.nippleDock.innerHTML = "";
      for (const nipple of state.nipples) {
        const row = document.createElement("div");
        row.className = "nipple-row";
        const side = document.createElement("div");
        side.className = "nipple-side";
        const dot = document.createElement("span");
        dot.className = `dot ${nipple.side.toLowerCase()}`;
        const label = document.createElement("span");
        label.textContent = nipple.side;
        side.append(dot, label);
        const code = document.createElement("code");
        const mm = nipple.point.map((v) => Math.round(v * 1000));
        code.textContent = `${mm[0]}, ${mm[1]}, ${mm[2]} mm | conf ${nipple.confidence.toFixed(2)} | ${nipple.usedCameras.join(", ") || "no camera"}`;
        row.append(side, code);
        dom.nippleDock.append(row);
      }
    }

    function captureCanvas() {
      dom.canvas.toBlob((blob) => {
        if (!blob) {
          return;
        }
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `recon3d-${state.activeRun.id || "capture"}.png`;
        link.click();
        URL.revokeObjectURL(link.href);
      }, "image/png");
    }

    function setupUi() {
      for (const run of RUNS) {
        const option = document.createElement("option");
        option.value = run.id;
        option.textContent = run.label;
        dom.runSelect.append(option);
      }
      dom.runSelect.value = RUNS[0].id;
      dom.runSelect.addEventListener("change", () => {
        const run = RUNS.find((item) => item.id === dom.runSelect.value) || RUNS[0];
        loadRun(run);
      });

      document.querySelectorAll("#colorMode .segment").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("#colorMode .segment").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          state.colorMode = button.dataset.mode;
          updateCloudColors();
        });
      });

      dom.pointSize.addEventListener("input", () => {
        state.pointSize = Number(dom.pointSize.value);
        dom.pointSizeValue.textContent = state.pointSize.toFixed(1);
      });
      dom.showNipples.addEventListener("change", () => {
        state.showNipples = dom.showNipples.checked;
      });
      dom.showGrid.addEventListener("change", () => {
        state.showGrid = dom.showGrid.checked;
      });
      dom.showAxes.addEventListener("change", () => {
        state.showAxes = dom.showAxes.checked;
      });
      dom.autoRotate.addEventListener("change", () => {
        state.autoRotate = dom.autoRotate.checked;
      });
      dom.liveRefresh.addEventListener("change", () => {
        setLiveRefresh(dom.liveRefresh.checked);
      });
      dom.fitBtn.addEventListener("click", fitCamera);
      dom.resetBtn.addEventListener("click", resetCamera);
      dom.topBtn.addEventListener("click", topCamera);
      dom.captureBtn.addEventListener("click", captureCanvas);
      dom.loadLocalBtn.addEventListener("click", loadLocalResult);

      dom.canvas.addEventListener("pointerdown", (event) => {
        state.pointer.active = true;
        state.pointer.lastX = event.clientX;
        state.pointer.lastY = event.clientY;
        dom.canvas.setPointerCapture(event.pointerId);
      });
      dom.canvas.addEventListener("pointermove", (event) => {
        if (!state.pointer.active) {
          return;
        }
        const dx = event.clientX - state.pointer.lastX;
        const dy = event.clientY - state.pointer.lastY;
        state.pointer.lastX = event.clientX;
        state.pointer.lastY = event.clientY;
        state.camera.yaw += dx * 0.007;
        state.camera.pitch = clamp(state.camera.pitch + dy * 0.006, -1.25, 1.25);
      });
      dom.canvas.addEventListener("pointerup", (event) => {
        state.pointer.active = false;
        dom.canvas.releasePointerCapture(event.pointerId);
      });
      dom.canvas.addEventListener("pointercancel", () => {
        state.pointer.active = false;
      });
      dom.canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        const scale = Math.exp(event.deltaY * 0.001);
        state.camera.distance = clamp(state.camera.distance * scale, 0.04, 8);
      }, { passive: false });
    }

    function main() {
      try {
        initWebGL();
        setupUi();
        render();
        setLiveRefresh(dom.liveRefresh.checked);
        loadRun(RUNS[0]);
      } catch (error) {
        setLoading(`Viewer failed: ${error.message}`, true);
      }
    }

    main();
  </script>
</body>
</html>
